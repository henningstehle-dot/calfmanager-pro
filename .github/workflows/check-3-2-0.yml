name: CalfManager 3.2.0 - Buildpruefung (ohne Deployment)

on:
  push:
    branches:
      - pruefung-3-2-0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4
      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Abhaengigkeiten installieren
        run: npm ci --no-audit --no-fund
      - name: Automatisierte Tests
        run: npm test
      - name: TypeScript und Produktions-Build
        run: npm run build
